name: Publish to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure Pages (enables it on first run)
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Serve this workflow's output, not the branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The repository's Pages source was "Deploy from a branch", so GitHub's own
          # build of main ran after every push and overwrote this deployment.
          code=$(curl -sS -o /tmp/pages.json -w '%{http_code}' -X PUT \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages" -d '{"build_type":"workflow"}')
          echo "Pages source update returned HTTP $code"; cat /tmp/pages.json; echo
          if [ "$code" != "204" ] && [ "$code" != "200" ]; then
            echo "::warning::Could not switch the Pages source to GitHub Actions. Set it by hand: Settings, Pages, Build and deployment, Source: GitHub Actions."
          fi
      - name: Re-render the ride pages with the current templates
        run: python3 site/render.py . _site
      - name: Package the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Confirm the live site serves this commit
        run: |
          want="${GITHUB_SHA:0:10}"
          check() { curl -sS -H 'Cache-Control: no-cache' "https://niccapp0-stack.github.io/health-diary/build.json?c=$RANDOM" | tr -d '\n' || true; }
          ok=0
          for i in $(seq 1 24); do
            case "$(check)" in *"$want"*) ok=1; break;; esac
            sleep 10
          done
          if [ "$ok" != "1" ]; then
            echo "::error::The live site never served $want. Something else is overwriting the deployment."; exit 1
          fi
          echo "Live site serves $want. Holding for 90 seconds to make sure nothing replaces it."
          for i in 1 2 3; do
            sleep 30
            case "$(check)" in *"$want"*) echo "  still $want after $((i*30)) s";; *)
              echo "::error::The live site served $want and was then replaced. The legacy branch build is still on: set Settings, Pages, Build and deployment, Source to GitHub Actions."; exit 1;; esac
          done
          echo "Live site is serving $want and stayed that way."
